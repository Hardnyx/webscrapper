[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuentes-financieras"
version = "0.26.0"
description = "Reusable financial data scrapers with shared storage"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<4", "numpy>=1.26,<3", "pyarrow>=15,<24",
    "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "requests>=2.31,<3",
    "truststore>=0.10,<1", "curl_cffi>=0.16,<1", "certifi>=2024.2.2",
    "openpyxl>=3.1,<4", "xlrd>=2,<3", "packaging>=24,<27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
pdf = ["pypdf>=6,<7"]
browser = ["selenium>=4.20,<5"]
desktop = ["selenium>=4.20,<5"]
dev = ["pytest>=8,<10"]

[project.scripts]
fuentes-sync-rating-withdrawals = "fuentes_financieras.cli.retiros_clasificaciones:main"
fuentes-sync-mergers = "fuentes_financieras.cli.fusiones:main"
fuentes-sync-regulatory-announcements = "fuentes_financieras.cli.anuncios_regulatorios:main"
fuentes-sync-risk-documents = "fuentes_financieras.cli.documentos_riesgo:main"
fuentes-sync-fx-risk = "fuentes_financieras.cli.riesgo_cambiario:main"
fuentes-sync-participation = "fuentes_financieras.cli.participacion:main"
fuentes-sync-profitability = "fuentes_financieras.cli.rentabilidad:main"
fuentes-sync-funding = "fuentes_financieras.cli.fondeo:main"
fuentes-sync-writeoffs = "fuentes_financieras.cli.castigos:main"
fuentes-sync-credit-quality = "fuentes_financieras.cli.calidad_cartera:main"
fuentes-sync-liquidity = "fuentes_financieras.cli.liquidez:main"
fuentes-sync-solvency = "fuentes_financieras.cli.solvencia:main"
fuentes-sync-statements = "fuentes_financieras.cli.estados_financieros:main"
fuentes-sync-rates = "fuentes_financieras.cli.tasas_pasivas:main"
fuentes-sync-ratings = "fuentes_financieras.cli.clasificaciones_riesgo:main"
fuentes-sync-smv = "fuentes_financieras.cli.valores_cuota:main"
fuentes-sync-universe = "fuentes_financieras.cli.universo_depositos:main"
fuentes-sync-benchmarks = "fuentes_financieras.cli.referencias_tasas_pasivas:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
